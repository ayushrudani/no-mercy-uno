# coturn — the TURN relay for voice chat.
#
# Why this is not optional: your group is on different ISPs in different cities.
# STUN can punch through many NATs, but a meaningful share of combinations
# (symmetric NAT, carrier-grade NAT on mobile data) simply cannot connect
# peer-to-peer. Without a relay those pairs fail SILENTLY — two people just
# cannot hear each other, with no error anywhere.

listening-port=3478
tls-listening-port=5349

# Lightsail gives the instance a private IP and maps a public one. coturn must
# advertise the PUBLIC address or every candidate it hands out is unroutable.
listening-ip=0.0.0.0
external-ip=$PUBLIC_IP/$PRIVATE_IP

realm=uno.bunkcode.online
server-name=uno.bunkcode.online

# Time-limited credentials. The app server signs `<expiry>:<userId>` with this
# same secret and hands the result to the browser; coturn recomputes the HMAC.
# Must equal TURN_SECRET in the server's .env.
use-auth-secret
static-auth-secret=$TURN_SECRET

# TLS is commented out on purpose. Plain TURN on 3478 carries the audio and
# works without any of this.
#
# To enable turns: on 5349, reuse certbot's certificate. coturn runs as the
# `turnserver` user and cannot read /etc/letsencrypt/live by default, so grant
# it access rather than loosening the whole directory:
#
#   sudo setfacl -m u:turnserver:rx /etc/letsencrypt/live /etc/letsencrypt/archive
#   sudo setfacl -m u:turnserver:r  /etc/letsencrypt/archive/uno.bunkcode.online/*.pem
#
# then uncomment these and restart. Note certbot renewal rewrites the archive,
# so add a --deploy-hook that re-applies the ACL and restarts coturn.
# cert=/etc/letsencrypt/live/uno.bunkcode.online/fullchain.pem
# pkey=/etc/letsencrypt/live/uno.bunkcode.online/privkey.pem

# Relay port range. These must also be opened in the Lightsail firewall (UDP).
# 200 ports is far more than eight people need and keeps the rule list short.
min-port=49160
max-port=49360

# Audio only: nobody needs more than this, and a cap protects the box.
user-quota=12
total-quota=100
max-bps=128000

# Hardening. This relay exists for one game; it should refuse to be an open
# proxy into the private network or a reflector for anyone else's traffic.
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

fingerprint
stale-nonce=600
log-file=stdout
simple-log
