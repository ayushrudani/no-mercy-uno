# nginx site for uno.bunkcode.online
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/no-mercy-uno
#   sudo ln -s /etc/nginx/sites-available/no-mercy-uno /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add the TLS lines:
#   sudo certbot --nginx -d uno.bunkcode.online
#
# HTTPS is not optional here. getUserMedia refuses to run on an insecure
# origin, so without a certificate the microphone never opens and voice chat
# cannot work at all.

server {
    listen 80;
    listen [::]:80;
    server_name uno.bunkcode.online;

    # certbot rewrites this to a 301 once the certificate exists.
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uno.bunkcode.online;

    # --- TLS ---------------------------------------------------------------
    # certbot fills these in. Do not hand-edit them; `certbot renew` rewrites
    # this block.
    # ssl_certificate     /etc/letsencrypt/live/uno.bunkcode.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/uno.bunkcode.online/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- security headers ---------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The app needs the microphone; nothing else.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # Nothing here accepts uploads. A small cap costs nothing and closes a door.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- websockets ---------------------------------------------------------
    #
    # This block must come before the catch-all. Socket.IO opens a connection
    # that stays up for a whole game night, so it needs the HTTP/1.1 upgrade
    # headers, buffering off, and timeouts measured in hours.
    #
    # The default proxy_read_timeout is 60s. Leave it and every player is
    # silently disconnected a minute after the table goes quiet -- which looks
    # exactly like a flaky connection and is miserable to diagnose.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # --- everything else ----------------------------------------------------
    #
    # The Node process serves the built client itself (WEB_DIST) and already
    # handles the SPA fallback and the /api 404s correctly, so nginx proxies
    # the lot rather than duplicating that routing.
    #
    # If you later want nginx to serve the static assets directly, add a
    # `location /assets/` with an alias to apps/web/dist/assets and a long
    # cache header -- those filenames are content-hashed, so they are safe to
    # cache forever.
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/no-mercy-uno.access.log;
    error_log  /var/log/nginx/no-mercy-uno.error.log;
}
