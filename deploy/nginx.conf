# nginx site for No Mercy UNO
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/no-mercy-uno
#   sudo ln -sf /etc/nginx/sites-available/no-mercy-uno /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Plain HTTP against the instance's public IP. There is no certificate because
# a public CA will not issue one for a bare IP address -- that needs a domain.
#
# The cost of no HTTPS is voice chat: browsers refuse getUserMedia on an
# insecure origin, so the microphone never opens. Cards, chat and reactions all
# work fine.
#
# ONCE YOU HAVE A DOMAIN, do not hand-edit this file -- run
#
#     bash deploy/https.sh your.domain
#
# which gets a certificate, writes a config serving the domain over HTTPS and
# the bare IP over plain HTTP, and sets up renewal. It replaces this file.

server {
    listen 80;
    listen [::]:80;

    # The instance's static IP. Swap in a domain here when you have one.
    server_name 13.232.9.123;

    # Nothing here accepts uploads. A small cap costs nothing and closes a door.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- websockets ---------------------------------------------------------
    #
    # This block must come before the catch-all. Socket.IO holds a connection
    # open for a whole game night, so it needs the HTTP/1.1 upgrade headers,
    # buffering off, and a timeout measured in hours.
    #
    # nginx defaults proxy_read_timeout to 60s. Leave it and every player is
    # silently disconnected a minute after the table goes quiet -- which looks
    # exactly like a flaky connection and is miserable to diagnose.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # --- everything else ----------------------------------------------------
    #
    # The Node process serves the built client itself and already handles the
    # SPA fallback and the /api 404s, so nginx proxies the lot rather than
    # duplicating that routing.
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/no-mercy-uno.access.log;
    error_log  /var/log/nginx/no-mercy-uno.error.log;
}
